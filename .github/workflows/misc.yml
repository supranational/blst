name: misc

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'bindings/go/**'
      - 'bindings/rust/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'bindings/go/**'
      - 'bindings/rust/**'
  workflow_dispatch:

jobs:
  misc-ubuntu-latest:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Environment
      run: |
        lscpu
        echo ---
        env | sort

    - name: Parse blst.hpp
      run: c++ -std=c++11 -fsyntax-only -x c++ bindings/blst.hpp

    - name: Python
      run: bindings/python/run.me

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 11
    - name: Java
      run: bindings/java/run.me

    - uses: actions/setup-node@v7
      with:
        node-version: '20.x'
    - name: Node.js
      run: |
        node_js=bindings/node.js
        if [ -x $node_js/run.me ]; then
            $node_js/run.me
            (cd $node_js; npm install node-addon-api && rm blst_wrap.cpp)
            $node_js/run.me
        fi
    - name: node-gyp
      run: |
        node_js=bindings/node.js
        if [ -f $node_js/binding.gyp -a -f $node_js/blst_wrap.cpp ]; then
            npm install --global node-gyp || true
            if which node-gyp > /dev/null 2>&1; then
              ( cd $node_js;
                node-gyp configure;
                node-gyp build;
                env NODE_PATH=build/Release: node runnable.js;
              )
            fi
        fi
    - name: TypeScript
      run: |
        node_js=bindings/node.js
        if [ -f $node_js/blst.hpp.ts -a -f $node_js/blst.node ]; then
            npm install --global typescript || true
            if which tsc > /dev/null 2>&1; then
              ( cd $node_js;
                npm install @types/node;
                tsc runnable.ts --ignoreConfig --types node --module commonjs;
                env NODE_PATH=.: node runnable.js;
              )
           fi
        fi

    - name: Emscripten
      uses: docker://emscripten/emsdk
      with:
        args: >
          bindings/emscripten/run.me -O2

    - name: C#
      run: |
        bindings/c#/run.me;
        if which dotnet > /dev/null 2>&1; then
            cd bindings/c#
            [ -f libblst.dll.so ] || ../../build.sh -dll
            dotnet run -c Release
        fi

    - uses: actions/cache@v6
      with:
        path: |
          ~/.cache/zig
          ~/zig-x86_64-linux-*
          ~/.wasmtime
        key: ${{ runner.os }}-zig-github

    - name: Install Wasmtime
      run: if [ ! -d ~/.wasmtime/bin ]; then curl https://wasmtime.dev/install.sh -sSf | bash; fi

    - name: Zig
      run: |
        which minisign > /dev/null 2>&1 || sudo apt-get -qq install minisign > /dev/null
        curl https://ziglang.org/download/community-mirrors.txt -sSfo mirrors.txt && \
        for ver in 0.14.1 0.17.0; do (
            base_dir=zig-x86_64-linux-$ver
            if [ ! -d ~/$base_dir ]; then
                mirror=`shuf -n 1 mirrors.txt`
                echo "downloading $base_dir from $mirror"
                curl $mirror/$base_dir.tar.xz -sSfo $base_dir.tar.xz && \
                curl https://ziglang.org/download/$ver/$base_dir.tar.xz.minisig -sSfo $base_dir.minisig && \
                minisign -V -P "RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U" \
                         -x $base_dir.minisig -m $base_dir.tar.xz -q || \
                (rm -f $base_dir.* && echo "$ver download failure")
                if [ -f $base_dir.tar.xz ]; then
                    unxz -c $base_dir.tar.xz | tar xf - --directory ~
                    rm $base_dir.*
                fi
            fi
            if [ -x ~/$base_dir/zig ]; then
                echo
                echo "--- test $base_dir"
                PATH=~/$base_dir:$PATH
                zig build test --summary new
                echo '--- test wasm32-wasi'
                PATH=~/.wasmtime/bin:$PATH
                zig build test -Dtarget=wasm32-wasi -fwasmtime --summary new
            fi
        ); done
